<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff &amp; Admin Login | FOUR BROTHERS Cleaning</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1B33; --blue-deep:#163A6B; --blue:#215A9C; --blue-bright:#4F8FE0;
    --steel:#5B6B7C; --ink:#1B2430; --paper:#F5F8FC; --white:#FFFFFF; --line:#DCE3ED;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);font-family:'Inter',system-ui,sans-serif;color:var(--ink);padding:24px;
  }
  .card{
    width:100%;max-width:400px;background:var(--white);border:1px solid var(--line);
    border-radius:14px;padding:36px;box-shadow:0 20px 50px rgba(11,27,51,.08);
  }
  .card img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 14px;}
  h1{font-family:'Archivo';font-size:1.3rem;font-weight:800;color:var(--navy);text-align:center;margin:0 0 4px;}
  .sub{text-align:center;color:var(--steel);font-size:.9rem;margin-bottom:26px;}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:7px;font-size:.95rem;margin-bottom:16px;background:var(--paper);}
  input:focus{outline:2px solid var(--blue-bright);outline-offset:1px;background:var(--white);}
  button.submit{
    width:100%;padding:13px;border:none;border-radius:7px;background:var(--blue);
    color:var(--white);font-weight:700;font-size:.95rem;cursor:pointer;
  }
  button.submit:hover{background:var(--blue-deep);}
  button.submit:disabled{opacity:.6;cursor:default;}
  #error{color:#B3261E;font-size:.85rem;margin-top:12px;text-align:center;display:none;}
  .back{display:block;text-align:center;margin-top:22px;font-size:.85rem;color:var(--steel);text-decoration:none;}
  .back:hover{color:var(--navy);}
</style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="FOUR BROTHERS Cleaning logo">
    <h1>Team sign in</h1>
    <p class="sub">For FOUR BROTHERS staff and admin only.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="submit" id="submitBtn">Sign in</button>
      <p id="error"></p>
    </form>
    <a class="back" href="index.html">← Back to the main site</a>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="dashboard-data.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const error = document.getElementById('error');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    error.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    auth.signInWithEmailAndPassword(email, password)
      .then(cred => getUserRole(cred.user.uid))
      .then(role => {
        if(role === 'admin'){
          window.location.href = 'admin.html';
        } else if(role === 'staff'){
          window.location.href = 'staff.html';
        } else {
          error.textContent = "Your account doesn't have admin or staff access yet. Ask the site admin to set it up.";
          error.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
          auth.signOut();
        }
      })
      .catch(err => {
        error.textContent = 'Email or password is incorrect.';
        error.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      });
  });
</script>
</body>
</html>
